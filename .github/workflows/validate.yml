name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check project structure and identity
        run: python tools/validate.py
      - name: Download Godot 4.7.2
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee godot-import.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' godot-import.log
      - name: Smoke launch
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 30 2>&1 | tee godot-launch.log
          ! grep -E 'SCRIPT ERROR:|ERROR:' godot-launch.log
      - name: Gameplay screen smoke checks
        env:
          DTR_TEST_MODE: '1'
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/smoke.gd
